name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑测试（逻辑层 + 渲染层烟测 + 内容契约）
        run: npm test
      - name: 内容表校验
        run: npm run validate
      - name: 架构约束（确定性、依赖方向、颜色来源、fx 事件登记）
        run: npm run arch
      - name: 体积检查（零构建，源码原样下发）
        run: npm run size
      - name: 平衡回归断言（每级升级必须有用、一局必须结束、帧率无关性等）
        run: npm run check
      - name: 平衡回归报告（只输出，不做断言）
        run: npm run balance
