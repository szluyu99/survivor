<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>色块幸存者</title>
<meta name="description" content="浏览器里直接开打的割草小游戏：自动攻击，边跑边升级，看你能活多久。">

<!-- 分享卡片。og:image 是相对路径，Telegram / Twitter 能解析，
     Facebook 要求绝对地址——等 Pages 域名定了把下面两处换成完整 URL -->
<meta property="og:type" content="website">
<meta property="og:title" content="色块幸存者">
<meta property="og:description" content="自动攻击，边跑边升级，看你能活多久。一局一两分钟，浏览器直接玩。">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">

<!-- favicon 内嵌 SVG，不额外加文件 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%237ee081' stroke='%2306070b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e3ffe8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0c12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; cursor: crosshair; }
  /* 竖屏提示：画面是 16:9 的，竖着玩会挤成一条 */
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(6,8,13,0.94); color: #9aa3b8; font-size: 15px; text-align: center;
            padding: 24px; line-height: 2; z-index: 10; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">把手机横过来玩<br>画面是 16:9 的，竖屏会挤成一条<br><span style="color:#4a5270">横过来这个提示就没了</span></div>
<script type="module" src="./src/game.js"></script>
</body>
</html>
